<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Панель менеджера — RENTOP.KG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cabinet.css">
  <link rel="stylesheet" href="css/manager.css">
</head>
<body class="cabinet-page">
  <header class="cabinet-header"><a class="cabinet-brand" href="/" aria-label="На главную RENTOP.KG">RENTOP.<span>KG</span></a><a class="cabinet-back" href="/">← На сайт</a></header>
  <main class="manager-main">
    <section class="manager-head"><div><p class="cabinet-eyebrow">ВНУТРЕННЯЯ ПАНЕЛЬ</p><h1>Рабочие заявки</h1><p>Новые заявки, документы и обращения — в одном месте.</p><p class="manager-bakai-check" id="manager-bakai-check" hidden></p></div><div class="manager-head-actions"><button id="manager-test-bakai" class="manager-bakai-test" type="button">Проверить Bakai</button><button id="manager-refresh" class="cabinet-action" type="button">Обновить</button></div></section>
    <section class="manager-gate" id="manager-gate" hidden><h2>Вход менеджера</h2><p>Используйте номер, указанный в настройках менеджера. Этот вход не открывает клиентский кабинет.</p><form id="manager-phone-form"><label for="manager-phone">Рабочий номер</label><input id="manager-phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="19" value="+996 " placeholder="+996 (___) __-__-__" required><button class="cabinet-primary" type="submit">Получить код</button></form><form id="manager-code-form" hidden><label for="manager-code">Код из SMS</label><input id="manager-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required><button class="cabinet-primary" type="submit">Открыть рабочую панель</button><button class="cabinet-text-button" type="button" id="manager-change-phone">Изменить номер</button></form><p class="cabinet-status" id="manager-login-status" role="status"></p></section>
    <section id="manager-dashboard" hidden><div class="manager-stats" id="manager-stats"></div><div class="manager-toolbar"><label><span>Найти заявку</span><input id="manager-search" type="search" placeholder="Код заявки, клиент, телефон, ноутбук"></label><div class="manager-filters"><button class="is-active" data-filter="all">Все</button><button data-filter="new">Новые</button><button data-filter="documents">Документы</button><button data-filter="active">Активные</button><button data-filter="closed">Завершённые</button></div><button class="manager-clear-tests" id="manager-clear-tests" type="button">Очистить тестовые</button></div><div class="manager-orders" id="manager-orders"></div></section>
    <p class="cabinet-status" id="manager-status" role="status"></p>
  </main>
  <div class="cabinet-document-viewer" id="manager-document-viewer" hidden role="dialog" aria-modal="true" aria-label="Просмотр документа"><div class="cabinet-document-viewer-card"><button class="cabinet-document-viewer-close" id="manager-document-viewer-close" type="button" aria-label="Закрыть просмотр">×</button><div id="manager-document-viewer-content"></div></div></div>
  <script type="module" src="js/manager.js"></script>
</body>
</html>
